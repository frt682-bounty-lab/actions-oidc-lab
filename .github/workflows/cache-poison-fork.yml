name: cache-poison-fork
on:
  pull_request:
  workflow_dispatch:
jobs:
  poison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write colliding cache
        uses: actions/cache@v4
        with:
          path: poison-cache
          key: bounty-Linux-static
      - run: |
          mkdir -p poison-cache
          echo "FORK_POISON_$(date -u +%Y%m%dT%H%M%SZ)" > poison-cache/POISONED
          echo "wrote poison marker"
      - name: Save cache explicitly
        uses: actions/cache/save@v4
        with:
          path: poison-cache
          key: bounty-Linux-static
